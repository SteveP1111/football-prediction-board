name: Audit Football Bookmaker Odds Integration

on:
  pull_request:
    paths:
      - 'scripts/fetch_odds.py'
      - 'tests/test_odds_collector.py'
      - '.github/workflows/football-odds.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preflight is free; collect can use at most two API credits'
        required: true
        type: choice
        default: preflight
        options:
          - preflight
          - collect

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test collector without API requests
        run: python3 -m unittest discover -s tests -p 'test_odds_collector.py' -v

  api-preflight:
    needs: offline-tests
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Authenticate and check league IDs with zero billable credits
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 scripts/fetch_odds.py --mode preflight

  live-smoke-test:
    needs: api-preflight
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'collect'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate EPL odds with a strict two-credit cap
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 scripts/fetch_odds.py --mode collect --sport soccer_epl --max-credits 2
      # Intentionally no upload-artifact or commit: raw odds stay on the runner.
