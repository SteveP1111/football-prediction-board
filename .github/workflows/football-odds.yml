name: Audit Football Bookmaker Odds Integration

on:
  pull_request:
    paths:
      - 'scripts/fetch_odds.py'
      - 'tests/test_odds_collector.py'
      - 'scripts/edge_comparison.py'
      - 'tests/test_edge_comparison.py'
      - 'index.html'
      - '.github/workflows/football-odds.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preflight is free; collect can use at most two API credits'
        required: true
        type: choice
        default: preflight
        options:
          - preflight
          - collect

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test all prediction and odds comparison modules without API requests
        run: python3 -m unittest discover -s tests -v
      - name: Check website JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html=Path("index.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script>(.*?)</script>",html,re.S)
          assert len(scripts)==1
          for path in ("data/latest.json","data/edges/latest.json"):
              assert path in html
          Path("/tmp/football-edge-board.js").write_text(scripts[0],encoding="utf-8")
          PY
          node --check /tmp/football-edge-board.js

  api-preflight:
    needs: offline-tests
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Authenticate and check league IDs with zero billable credits
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 scripts/fetch_odds.py --mode preflight

  live-smoke-test:
    needs: api-preflight
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'collect'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate EPL odds with a strict two-credit cap
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 scripts/fetch_odds.py --mode collect --sport soccer_epl --max-credits 2
      # Intentionally no upload-artifact or commit: raw odds stay on the runner.
