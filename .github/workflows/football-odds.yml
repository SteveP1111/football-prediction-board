name: Collect Football Bookmaker Odds
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/odds-api-integration
      - name: Fetch odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 scripts/fetch_odds.py
      - name: Commit timestamped odds snapshot to feature branch
        run: |
          git add data/odds/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record bookmaker odds snapshot"
          git push origin HEAD:feature/odds-api-integration
