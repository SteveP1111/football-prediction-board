name: Test Football Bookmaker Odds Integration
on:
  pull_request:
    paths:
      - 'scripts/fetch_odds.py'
      - 'tests/test_odds_collector.py'
      - '.github/workflows/football-odds.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test odds collector without API requests
        run: python3 -m unittest discover -s tests -p 'test_odds_collector.py' -v
  live-smoke-test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch odds using GitHub secret
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 scripts/fetch_odds.py
      - name: Upload private-to-run odds snapshot
        uses: actions/upload-artifact@v4
        with:
          name: football-odds-smoke-test
          path: data/odds/*.json
          retention-days: 1
